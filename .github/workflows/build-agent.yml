name: Build IL2CPP Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Build libTool.so
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          "${ANDROID_NDK_HOME}/ndk-build" \
            -C app/src/main \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            NDK_LIBS_OUT=libs \
            NDK_OUT=obj \
            -j"$(nproc)"
          test -f app/src/main/libs/arm64-v8a/libTool.so
          file app/src/main/libs/arm64-v8a/libTool.so
          ls -lh app/src/main/libs/arm64-v8a/libTool.so

      - name: Upload libTool.so
        uses: actions/upload-artifact@v4
        with:
          name: libTool-arm64-v8a
          path: app/src/main/libs/arm64-v8a/libTool.so
          if-no-files-found: error
